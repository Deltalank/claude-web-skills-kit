name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skill structure
        run: python scripts/validate-skills.py

      - name: Check release consistency
        run: python scripts/check-release-consistency.py

      - name: Check repository hygiene
        run: python scripts/check-repo-hygiene.py
